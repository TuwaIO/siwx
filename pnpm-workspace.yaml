packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: false
  sharp: false
minimumReleaseAgeExclude:
  - '@tuwaio/*'
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/pretty-format@5.0.5'
  - '@vitest/spy@5.0.5'
  - '@vitest/ui@5.0.5'
  - '@vitest/utils@5.0.5'
  - jsdom@30.1.3
  - react-dom@19.3.1
  - react@19.3.1
  - vitest@5.0.5
overrides:
  # nextra-theme-docs 4.6.1 validates its Layout props with zod; with zod 4.4 and newer the validation rejects them
  # ("expected nonoptional ... at children"). Keep 4.3 for Nextra only.
  nextra>zod: 4.3.6
  nextra-theme-docs>zod: 4.3.6
